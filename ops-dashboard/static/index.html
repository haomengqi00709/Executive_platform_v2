<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEO Platform Ops</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:9999px; vertical-align:middle; }
  .row-expand { display:none; }
  tr.expanded + .row-expand { display:table-row; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-semibold">CEO Platform Ops</h1>
      <p class="text-xs text-slate-500" id="generated">loading…</p>
    </div>
    <div class="flex gap-6 text-sm">
      <div class="text-center">
        <div class="text-2xl font-bold" id="cnt-total">—</div>
        <div class="text-slate-500">total</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-emerald-600" id="cnt-healthy">—</div>
        <div class="text-slate-500">healthy</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-rose-600" id="cnt-broken">—</div>
        <div class="text-slate-500">broken</div>
      </div>
    </div>
  </div>
</header>

<main class="p-6">
  <div id="msg" class="hidden mb-4 p-3 rounded bg-amber-50 border border-amber-200 text-amber-900 text-sm"></div>

  <div class="bg-white rounded shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-100 text-slate-600">
        <tr>
          <th class="px-3 py-2 text-left">User</th>
          <th class="px-3 py-2 text-left">Role</th>
          <th class="px-3 py-2 text-left">Auth</th>
          <th class="px-3 py-2 text-left">Last refresh</th>
          <th class="px-3 py-2 text-left">Bot</th>
          <th class="px-3 py-2 text-left">Briefings</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const fmtTs = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)        return Math.floor(diff) + "s ago";
  if (diff < 3600)      return Math.floor(diff/60) + "m ago";
  if (diff < 86400)     return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
};

const authDot = status => {
  if (status === "healthy") return '<span class="dot bg-emerald-500"></span> healthy';
  if (status === "broken")  return '<span class="dot bg-rose-500"></span> broken';
  return '<span class="dot bg-slate-300"></span> ' + (status || "—");
};

const botCell = b => {
  if (!b) return '<span class="text-slate-400">—</span>';
  if (!b.enabled) return '<span class="text-slate-400">disabled</span>';
  if (!b.last_seen_ts) return '<span class="dot bg-slate-300"></span> never seen';
  const age = (Date.now() - new Date(b.last_seen_ts).getTime()) / 1000;
  if (age > 600) return '<span class="dot bg-rose-500"></span> stalled ' + fmtTs(b.last_seen_ts);
  return '<span class="dot bg-emerald-500"></span> ' + fmtTs(b.last_seen_ts);
};

const briefingsCell = br => {
  if (!br) return "—";
  const sched = (br.enabled || 0) + "/" + (br.total || 0);
  const last = br.last_summary_run ? "ran " + fmtTs(br.last_summary_run) : "never ran";
  return sched + " enabled · " + last;
};

const roleCell = u => {
  if (u.role === "bot") {
    return 'bot → <span class="text-slate-500">' + (u.owner_email || "?") + '</span>';
  }
  if (u.linked_bot_email) {
    return 'user · bot: <span class="text-slate-500">' + u.linked_bot_email + '</span>';
  }
  return 'user';
};

const render = data => {
  document.getElementById("generated").textContent =
    "polled " + fmtTs(data.generated_at) + " · " + data.user_count + " accounts";
  document.getElementById("cnt-total").textContent   = data.user_count || 0;
  document.getElementById("cnt-healthy").textContent = data.healthy || 0;
  document.getElementById("cnt-broken").textContent  = data.broken || 0;

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const u of (data.users || [])) {
    if (u.error) {
      const er = document.createElement("tr");
      er.className = "border-t border-slate-100";
      er.innerHTML = '<td colspan="6" class="px-3 py-2 text-rose-600">' +
        u.uid + ": " + u.error + '</td>';
      rows.appendChild(er);
      continue;
    }
    const h = u.health || {};
    const tr = document.createElement("tr");
    tr.className = "border-t border-slate-100 cursor-pointer hover:bg-slate-50";
    tr.innerHTML =
      '<td class="px-3 py-2"><div class="font-medium">' + (u.username || "?") + '</div>' +
        '<div class="text-xs text-slate-400">' + u.uid.slice(0,8) + '</div></td>' +
      '<td class="px-3 py-2 text-xs">' + roleCell(u) + '</td>' +
      '<td class="px-3 py-2">' + authDot(h.status) +
        (h.consecutive_failures ? ' <span class="text-rose-600 text-xs">×' +
          h.consecutive_failures + '</span>' : '') + '</td>' +
      '<td class="px-3 py-2 text-xs text-slate-600">' + fmtTs(h.last_success_at) + '</td>' +
      '<td class="px-3 py-2 text-xs">' + botCell(u.bot) + '</td>' +
      '<td class="px-3 py-2 text-xs text-slate-600">' + briefingsCell(u.briefings) + '</td>';

    const tail = (u.diag_log_tail || []).join("\n");
    const expand = document.createElement("tr");
    expand.className = "row-expand bg-slate-50";
    expand.innerHTML = '<td colspan="6" class="px-6 py-3">' +
      (h.last_error ? '<div class="mb-2 text-rose-700 text-xs"><b>last error:</b> ' +
        h.last_error + '</div>' : '') +
      (h.broken_since ? '<div class="mb-2 text-rose-700 text-xs"><b>broken since:</b> ' +
        h.broken_since + '</div>' : '') +
      '<pre class="text-xs text-slate-600 bg-white p-2 rounded border border-slate-200 whitespace-pre-wrap">' +
        (tail || '(no diag log)') + '</pre></td>';

    tr.onclick = () => tr.classList.toggle("expanded");
    rows.appendChild(tr);
    rows.appendChild(expand);
  }
};

const load = async () => {
  try {
    const r = await fetch("/api/state", { credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (data.empty) {
      document.getElementById("msg").classList.remove("hidden");
      document.getElementById("msg").textContent = data.message || "Waiting for first poll…";
      return;
    }
    document.getElementById("msg").classList.add("hidden");
    render(data);
  } catch (e) {
    document.getElementById("msg").classList.remove("hidden");
    document.getElementById("msg").textContent = "Fetch failed: " + e.message;
  }
};

load();
setInterval(load, 30000);
</script>

</body>
</html>
