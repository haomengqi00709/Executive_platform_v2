name: Deploy ops-dashboard to Azure

# Mirrors the main project's azure-deploy.yml but for the ops-dashboard
# sub-folder. Manual-only trigger by default so we don't redeploy ops on
# every unrelated push to main. Flip to auto-on-push-to-main once the
# service is stable.

on:
  workflow_dispatch: {}

env:
  ACR_NAME:    ceoplatformv2acr
  IMAGE_NAME:  ops-dashboard
  WEBAPP_NAME: ceo-ops-dashboard
  RG_NAME:     ceo-platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: azure-deploy-ops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          echo "tag=${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Build tag: ${STAMP}-${SHORT_SHA}"

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" \
            --image "$IMAGE_NAME:latest" \
            --platform linux/amd64 \
            --file ops-dashboard/Dockerfile \
            ops-dashboard/

      - name: Point App Service at new image
        run: |
          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RG_NAME" \
            --docker-custom-image-name "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RG_NAME"

      - name: Smoke check (5x retry, 10s apart)
        run: |
          # NOTE: Update this URL after the App Service is created — the
          # canadacentral-01 suffix is assigned by Azure, not deterministic.
          URL="https://${WEBAPP_NAME}.azurewebsites.net/health"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$URL"; then
              echo "✅ /health OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "❌ /health never came up — check Azure logs"
          exit 1
